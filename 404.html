<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page melted — Meltpoint Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Instrument+Serif:ital@1&family=Inter+Tight:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:#08060b;color:#f4eee8;font-family:'Inter Tight',sans-serif;text-align:center;overflow:hidden;padding:24px}
.blob{position:fixed;inset:-20%;background:radial-gradient(40% 40% at 50% 35%,rgba(255,79,216,.35),transparent 70%),radial-gradient(30% 30% at 30% 70%,rgba(255,163,108,.25),transparent 70%),radial-gradient(30% 30% at 70% 70%,rgba(139,92,255,.3),transparent 70%);filter:blur(30px);animation:f 9s ease-in-out infinite alternate}
@keyframes f{to{transform:translateY(4%) scale(1.06)}}
h1{position:relative;font:800 clamp(90px,22vw,240px)/.9 'Syne',sans-serif;letter-spacing:-.05em;background:linear-gradient(180deg,#fff 30%,#ff4fd8 70%,transparent);-webkit-background-clip:text;background-clip:text;color:transparent}
.drip{position:relative;display:flex;justify-content:center;gap:clamp(18px,5vw,60px);height:70px;margin-top:-10px}
.drip i{width:10px;border-radius:0 0 10px 10px;background:linear-gradient(#ff4fd8,transparent);animation:d 2.6s ease-in infinite}
.drip i:nth-child(2){animation-delay:.6s}.drip i:nth-child(3){animation-delay:1.2s}.drip i:nth-child(4){animation-delay:1.8s}
@keyframes d{0%{height:0;opacity:1}80%{height:70px;opacity:1}100%{height:70px;opacity:0}}
p{position:relative;font-size:18px;color:#a49aa8;margin:18px 0 30px}p em{font:italic 26px 'Instrument Serif',serif;color:#f4eee8}
a{position:relative;display:inline-block;background:linear-gradient(90deg,#ffa36c,#ff4fd8,#8b5cff);color:#08060b;font-weight:600;text-decoration:none;padding:15px 24px;border-radius:99px}
</style></head>
<body><div class="blob"></div><main><h1>404</h1><div class="drip"><i></i><i></i><i></i><i></i></div><p><em>This page melted.</em><br>It doesn't exist — or it dripped away.</p><a href="/">Back to Meltpoint Studio →</a></main></body></html>
