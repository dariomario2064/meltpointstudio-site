name: Publish site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['.github/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove old hosting tags
        run: |
          python3 - <<'PY'
          import re, pathlib
          for p in pathlib.Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              t = re.sub(r'\s*<!--\s*This site is hosted on Netlify.*?-->', '', s, flags=re.S)
              t = re.sub(r'\s*<script[^>]*/\.netlify/scripts/[^>]*>\s*</script>', '', t)
              if t != s:
                  p.write_text(t, encoding='utf-8')
                  print('cleaned', p)
          PY
          if ! git diff --quiet; then
            git config user.name "Meltpoint Studio"
            git config user.email "dario@meltpointstudio.com"
            git commit -am "Remove old hosting tags"
            git push
          fi
      - name: Prepare files
        run: |
          mkdir -p _site
          cp *.html _site/
          [ -f CNAME ] && cp CNAME _site/ || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
