name: Publish site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['.github/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy current site from Netlify (first run only)
        run: |
          if [ ! -f index.html ]; then
            for f in index.html 404.html pay.html quote.html; do
              curl -fsSL "https://scintillating-blancmange-6c7923.netlify.app/$f" -o "$f"
            done
            git config user.name "Meltpoint Studio"
            git config user.email "dario@meltpointstudio.com"
            git add index.html 404.html pay.html quote.html
            git commit -m "Import site from Netlify"
            git push
          fi
      - name: Prepare files
        run: |
          mkdir -p _site
          cp index.html 404.html pay.html quote.html _site/
          [ -f CNAME ] && cp CNAME _site/ || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
